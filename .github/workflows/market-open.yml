name: TradeQuest Market Open

on:
  schedule:
    # 9:30 AM ET (13:30 UTC) Mon–Fri — pre-market check then next_open order execution.
    - cron: '30 13 * * 1-5'
  workflow_dispatch: {}

jobs:
  execute-next-open:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      # Step 1: Pre-market flag check — agent reviews holdings BEFORE orders fire.
      # RUN_TYPE=day_start → flag-only mode, no trade decisions, logs to agent_log.json.
      # This surfaces early warnings (e.g., approaching MA breaks) and is now visible
      # in the Agent tab — previously this step was entirely missing from the workflow.
      - name: Pre-market agent check (day_start)
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_ACCOUNT_NAME: ${{ secrets.ALPACA_ACCOUNT_NAME }}
          ALPACA_API_KEY:      ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:   ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:     ${{ secrets.ALPACA_BASE_URL }}
          RUN_TYPE:            day_start
        run: python bot/agent.py

      # Step 2: Execute pending next_open orders approved by prior evening's agent.
      # Also writes data/execution_summary.json so the next agent run can confirm
      # what actually executed (closing the "KLAC never sold" feedback gap).
      - name: Execute next_open orders
        env:
          ALPACA_ACCOUNT_NAME: ${{ secrets.ALPACA_ACCOUNT_NAME }}
          ALPACA_API_KEY:      ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:   ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:     ${{ secrets.ALPACA_BASE_URL }}
          MARKET_OPEN_RUN:     "true"
        run: python bot/update.py

      - name: Commit results
        run: |
          git config user.name "TradeQuest Bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "market-open: $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin HEAD
            git push -u origin HEAD
          fi
